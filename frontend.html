<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MovieMind</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

nav{
background:#000;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav h1{
color:red;
}

.hero{
text-align:center;
padding:30px;
}

input{
padding:10px;
width:300px;
border:none;
border-radius:5px;
}

button{
padding:10px 15px;
background:red;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

#movies{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#222;
border-radius:10px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:10px;
}

.info h3{
margin-bottom:10px;
}
</style>

</head>
<body>

<nav>
<h1>🎬 MovieMind</h1>
</nav>

<div class="hero">

<h2>Movie Recommendation System</h2>

<br>

<input
type="text"
id="search"
placeholder="Search Movies"
>

<button onclick="searchMovie()">
Search
</button>

</div>

<div id="movies"></div>

<script>

const movieContainer =
document.getElementById("movies");

async function loadMovies(){

const response =
await fetch(
"http://localhost:5000/api/movies/popular"
);

const movies =
await response.json();

displayMovies(movies);
}

function displayMovies(movies){

movieContainer.innerHTML="";

movies.forEach(movie=>{

movieContainer.innerHTML += `

<div class="card">

<img src=
"https://image.tmdb.org/t/p/w500${movie.poster_path}">

<div class="info">

<h3>${movie.title}</h3>

<p>⭐ ${movie.vote_average}</p>

<p>${movie.release_date}</p>

<p>
${movie.overview.substring(0,100)}...
</p>

<br>

<button onclick='saveFavorite(${JSON.stringify(movie)})'>
❤️ Favorite
</button>

</div>

</div>

`;

});

}

async function searchMovie(){

let query =
document.getElementById("search").value;

const response =
await fetch(
`http://localhost:5000/api/movies/search/${query}`
);

const movies =
await response.json();

displayMovies(movies);
}

function saveFavorite(movie){

let favorites =
JSON.parse(
localStorage.getItem("favorites")
)||[];

favorites.push(movie);

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

alert("Added To Favorites");
}

loadMovies();

</script>

</body>
</html>
